name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: cd contracts && forge install foundry-rs/forge-std --no-git && forge build
      - run: pnpm sdk:build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm test:integration
      - run: pnpm test:pack
      - run: pnpm --filter @lastdollar/web build
      - run: pnpm --filter @lastdollar/web exec playwright install --with-deps chromium
      - run: pnpm e2e
